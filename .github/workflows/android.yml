name: Android
on:
  push: { branches: [main] }
  pull_request:
  release: { types: [published] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.31.6"
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Release APK (signed when secrets exist)
        if: github.event_name == 'release'
        working-directory: android
        env:
          KS_B64: ${{ secrets.DUVO_KEYSTORE_B64 }}
          DUVO_KEYSTORE_PASSWORD: ${{ secrets.DUVO_KEYSTORE_PASSWORD }}
          DUVO_KEY_ALIAS: ${{ secrets.DUVO_KEY_ALIAS }}
          DUVO_KEY_PASSWORD: ${{ secrets.DUVO_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/duvo.jks"; export DUVO_KEYSTORE="$RUNNER_TEMP/duvo.jks"; fi
          ./gradlew :app:assembleRelease
          cd app/build/outputs/apk/release && sha256sum *.apk > SHA256SUMS.txt
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
